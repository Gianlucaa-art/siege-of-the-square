<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bestiary - Siege of the Square</title>

  <!-- Bootstrap 5 da CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Font pixel per titoli e navbar -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <!-- Stile comune del sito -->
  <link rel="stylesheet" href="css/sito.css" />
</head>
<body>

  <!-- ==========================
       NAVBAR (uguale in tutte le pagine)
       ========================== -->
  <nav class="navbar navbar-expand-md navbar-sito">
    <div class="container">
      <a class="navbar-brand" href="index.html">Siege of the Square</a>
      <!-- Pulsante "hamburger" per schermi piccoli -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipale"
              aria-controls="menuPrincipale" aria-expanded="false" aria-label="Open the menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipale">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="bestiario.html">Bestiary</a></li>
          <li class="nav-item"><a class="nav-link" href="arena.html">Arena</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">

    <!-- ==========================
         TITOLO
         ========================== -->
    <h1 class="mb-4">Bestiary</h1>

    <!-- ==========================
         RICERCA
         ========================== -->
    <div class="row mb-4">
      <!-- Campo di ricerca per nome -->
      <div class="col-md-6 col-lg-5">
        <label for="ricerca" class="visually-hidden">Search a monster</label>
        <input type="search" class="form-control" id="ricerca" placeholder="Search a monster..." />
      </div>
    </div>

    <!-- ==========================
         BARRA DELLA SELEZIONE (aggiornata da JavaScript)
         ========================== -->
    <div class="barra-selezione mb-4">
      <span id="contatore-scelti">Chosen monsters: 0 / 3</span>
      <div class="azioni-selezione">
        <button id="btn-random" type="button" class="btn btn-outline-oro">Random foes</button>
        <button id="btn-combatti" type="button" class="btn btn-primary">Fight</button>
      </div>
    </div>

    <!-- ==========================
         CARD DEI MOSTRI (riempito da JavaScript)
         ========================== -->
    <div id="cards" class="row"></div>

  </main>

  <!-- ==========================
       MODALE DETTAGLIO MOSTRO (contenuto riempito da JavaScript)
       ========================== -->
  <div class="modal fade" id="modaleMostro" tabindex="-1" aria-labelledby="modaleMostroTitolo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modaleMostroTitolo"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-oro" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="btn-affronta">Add to battle</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================
       FOOTER
       ========================== -->
  <footer class="footer-sito text-center py-3">
    <div>Siege of the Square</div>
    <ul class="crediti">
      <li>Monster and weapon data: <a href="https://www.dnd5eapi.co" target="_blank" rel="noopener">D&amp;D 5e API</a>
        (SRD 5.1 by Wizards of the Coast, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>)</li>
      <li>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0)</li>
      <li>Sprites by <a href="https://luizmelo.itch.io" target="_blank" rel="noopener">LuizMelo</a> (CC0)</li>
    </ul>
  </footer>

  <!-- Script: Bootstrap, quello comune, poi quello della pagina -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comune.js"></script>
  <script src="js/bestiario.js"></script>
</body>
</html>
